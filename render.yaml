services:
  - type: web
    name: cryptocraze-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run dev:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: APP_ORIGIN
        fromService:
          type: web
          name: cryptocraze-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: COINGECKO_API_BASE
        value: https://api.coingecko.com/api/v3
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: COINGECKO_PRO_API_KEY
        sync: false
      - key: COINGECKO_DEMO_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - type: web
    name: cryptocraze-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cryptocraze-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_COINGECKO_API_BASE
        value: https://api.coingecko.com/api/v3
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
